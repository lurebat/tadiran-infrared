name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m compileall -q custom_components
      - run: python -c "import custom_components.tadiran_infrared.climate, custom_components.tadiran_infrared.config_flow"
